name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Pushes to main deploy to gh-pages, which the Benchmarks workflow also pushes to.
    # Share a concurrency group so the two never push at the same time.
    concurrency:
      group: ${{ github.event_name == 'push' && 'gh-pages' || format('docs-{0}', github.ref) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
      - run: uv python install 3.12
      - run: uv sync --group docs --extra matplotlib
      - run: uv run mkdocs build --strict -f docs/mkdocs.yml

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true
