name: Check URLs

# External links break without any change to the repository,
# so check them on a schedule instead of blocking pull requests.
on:
  schedule:
    # Mondays at 06:36 UTC.
    # The minute 36 has no meaning, it was picked at random to avoid the peak load on the hour.
    - cron: "36 6 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - lychee.toml
      - .github/workflows/check-urls.yml

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --config lychee.toml README.md CHANGELOG.md CITATION.cff 'docs/**/*.md'
