name: Links

# External links break without any change to the repository,
# so check them on a schedule instead of blocking pull requests.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays at 06:00 UTC
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - lychee.toml
      - .github/workflows/links.yml

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --config lychee.toml README.md CHANGELOG.md CITATION.cff 'docs/**/*.md'
