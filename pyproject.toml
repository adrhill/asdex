[project]
name = "asdex"
version = "0.2.0-DEV"
description = "Automatic Sparse Differentiation in JAX"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Adrian Hill", email = "gh@adrianhill.de" },
]
keywords = [
    "jax",
    "jaxpr",
    "automatic-differentiation",
    "automatic-sparse-differentiation",
    "sparse-automatic-differentiation",
    "sparsity-detection",
    "sparsity",
    "jacobian",
    "hessian",
    "graph-coloring",
    "scientific-computing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "jax>=0.9.0",
    "numba>=0.63.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
matplotlib = ["matplotlib>=3.5.0"]

[project.urls]
Homepage = "https://github.com/adrhill/asdex"
Documentation = "https://adrianhill.de/asdex"
Benchmarks = "https://adrianhill.de/asdex/benchmarks"
Repository = "https://github.com/adrhill/asdex"
Issues = "https://github.com/adrhill/asdex/issues"
PyPI = "https://pypi.org/project/asdex/"
Zenodo = "https://doi.org/10.5281/zenodo.18788242"

[dependency-groups]
dev = [
    "diffrax>=0.7.1",
    "flax>=0.12.3",
    "prek==0.3.8",
    "pytest>=8.0.0",
    "pytest-benchmark>=5.0.0",
    "pytest-cov>=6.0.0",
    "ruff==0.15.8",
    "sif2jax>=0.0.1",
    "sympy>=1.13.0",
    "ty==0.0.26",
]
docs = [
    "markdown-exec[ansi]>=1.9.0",
    "matplotlib>=3.5.0",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocs-matplotlib>=0.10.0",
    "mkdocstrings[python]>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asdex"]

[tool.pytest.ini_options]
addopts = "--tb=short -q --no-header -m 'not (slow or benchmark or cutest)'"
testpaths = ["tests"]
filterwarnings = [
    "ignore:Setting `jax_pmap_shmap_merge`:DeprecationWarning",
]
markers = [
    "elementwise: simple element-wise operations",
    "array_ops: array manipulation (slice, concat, reshape)",
    "control_flow: conditional operations (where, select)",
    "reduction: reduction operations (sum, max, prod)",
    "vmap: batched/vmapped operations",
    "coloring: row coloring algorithm tests",
    "jacobian: sparse Jacobian computation tests",
    "hessian: Hessian sparsity detection and computation",
    "fallback: documents conservative fallback behavior",
    "bug: documents known bugs",
    "slow: tests that take more than 1 second",
    "plot: matplotlib visualization smoke tests",
    "cutest: CUTEst benchmark problem tests (requires sif2jax)",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "D",        # pydocstyle
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "ICN",      # flake8-import-conventions
    "PIE",      # flake8-pie
    "PT",       # flake8-pytest-style
    "RSE",      # flake8-raise
    "RET",      # flake8-return
    "SIM",      # flake8-simplify
    "T20",      # flake8-print
    "E",        # pycodestyle errors
    "W",        # pycodestyle warnings
    "F",        # pyflakes
    "I",        # isort
    "PERF",     # perflint
    "PLC0415",  # prohibit imports outside of top-level
    "RUF",      # ruff-specific rules
    "UP",       # pyupgrade
]
ignore = [
    "E501",     # line too long (handled by formatter)
    "RUF001",   # ambiguous unicode (we use ×, ●, ⋅ intentionally)
    "RUF003",   # ambiguous unicode in comments (used for math)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.report]
exclude_also = [
    "case _ as unreachable:",
    "assert_never\\(",
    "if TYPE_CHECKING:",
]

[[tool.ty.overrides]]
include = ["src/asdex/_plotting.py"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

[tool.ty.environment]
python-version = "3.14"
